name: Backup approved Mahjong release to Dropbox

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Approved production commit SHA (40 hex characters)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mahjong-dropbox-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify input and required secrets
        env:
          SHA: ${{ inputs.release_sha }}
          APP_KEY: ${{ secrets.MAHJONG_DROPBOX_APP_KEY }}
          APP_SECRET: ${{ secrets.MAHJONG_DROPBOX_APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.MAHJONG_DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid SHA'; exit 1; }
          for value in "$APP_KEY" "$APP_SECRET" "$REFRESH_TOKEN"; do
            [[ -n "$value" ]] || { echo 'Missing Dropbox secret'; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Archive exact release and generate checksum
        env:
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          mkdir -p dist
          git archive --format=zip --output=dist/mahjong-v185-${SHA}.zip HEAD
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Upload and verify by downloading from Dropbox
        env:
          APP_KEY: ${{ secrets.MAHJONG_DROPBOX_APP_KEY }}
          APP_SECRET: ${{ secrets.MAHJONG_DROPBOX_APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.MAHJONG_DROPBOX_REFRESH_TOKEN }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          TOKEN=$(curl --fail --silent --show-error --retry 3 -u "$APP_KEY:$APP_SECRET" -d grant_type=refresh_token --data-urlencode "refresh_token=$REFRESH_TOKEN" https://api.dropbox.com/oauth2/token | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          FILE="dist/mahjong-v185-${SHA}.zip"
          TARGET="/6. 誰與爭鋒｜Mahjong PWA/1｜誰與爭鋒PWA/mahjong-v185-${SHA}.zip"
          export TARGET
          ARG=$(python3 -c 'import json,os; print(json.dumps({"path":os.environ["TARGET"],"mode":"add","autorename":False,"mute":True}))')
          curl --fail --silent --show-error --retry 3 -X POST https://content.dropboxapi.com/2/files/upload -H "Authorization: Bearer $TOKEN" -H "Dropbox-API-Arg: $ARG" -H "Content-Type: application/octet-stream" --data-binary @"$FILE" > /tmp/mahjong-upload.json
          python3 -c 'import json,os; d=json.load(open("/tmp/mahjong-upload.json")); assert d["path_display"]==os.environ["TARGET"], "Unexpected destination"'
          DOWNLOAD_ARG=$(python3 -c 'import json,os; print(json.dumps({"path":os.environ["TARGET"]}))')
          curl --fail --silent --show-error --retry 3 -X POST https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer $TOKEN" -H "Dropbox-API-Arg: $DOWNLOAD_ARG" -o /tmp/mahjong-verify.zip
          cmp "$FILE" /tmp/mahjong-verify.zip
          echo "Verified Dropbox backup for $SHA (downloaded bytes match)"
