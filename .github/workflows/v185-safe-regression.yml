name: Mahjong regression checks
on:
  push:
    branches: ['fix/**', 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recorder sync, settlement and history
        run: |
          node .github/tests/v186-3-data-regression.cjs
          node .github/tests/v187-continuity.cjs
          node tests/v185-next-match-simulation.cjs
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Check phone projection and live viewing
        run: |
          node .github/tests/projection-check.cjs
          node .github/tests/projection-controls-check.cjs
