/* 誰與爭鋒 V122 → 快速修正：麻俠身份/歷史名稱
   使用方式：把本檔內容貼到 V122 的 </body> 前（最後一個 </script> 後面也可）。
   不修改 PocketBase 資料，只修前端身份與歷史統計名稱解析。
*/
<script>
(function(){
  const V123_MAXIA_USER_ID = 'v66s5kn9px4fvv7';

  // 覆蓋舊版「指定帳號鎖定暱稱」判斷。
  // 舊常數即使仍存在，也不再讓舊 ID 決定麻俠身份。
  if (typeof isLockedNicknameAccount === 'function') {
    isLockedNicknameAccount = function(record = (typeof pbAuth !== 'undefined' ? pbAuth?.record : null)){
      return String(record?.id || '').trim() === V123_MAXIA_USER_ID;
    };
  }

  if (typeof accountDisplayName === 'function') {
    accountDisplayName = function(record = (typeof pbAuth !== 'undefined' ? pbAuth?.record : null)){
      return isLockedNicknameAccount(record) ? '麻俠' : String(record?.name || '').trim();
    };
  }

  // 歷史資料只做顯示名稱正規化；不改 PB 原始紀錄。
  if (typeof canonicalPlayerName === 'function') {
    const oldCanonicalPlayerName = canonicalPlayerName;
    canonicalPlayerName = function(name){
      const clean = String(name ?? '').trim();
      if (clean === '麻俠' || clean === '麻將俠' || clean === '龍隱王') return '麻俠';
      return oldCanonicalPlayerName(clean);
    };
  }

  // 個人戰績：正式會員優先以 users.id 找到對應 room_player，
  // 再取該 room_player 的 display_name，避免只靠 nickname 漏掉歷史牌局。
  if (typeof v40MemberPlayerName === 'function') {
    const oldV40MemberPlayerName = v40MemberPlayerName;
    v40MemberPlayerName = function(member, roomPlayers){
      const uid = String(member?.user || '').trim();
      const list = Array.isArray(roomPlayers) ? roomPlayers : [];

      if (uid) {
        const linked = list.find(p =>
          String(p?.user || '').trim() === uid &&
          String(p?.status || '') !== 'removed'
        );
        if (linked?.display_name) return canonicalPlayerName(linked.display_name);
      }

      if (uid === V123_MAXIA_USER_ID) return '麻俠';

      const fallback = oldV40MemberPlayerName(member, roomPlayers);
      return canonicalPlayerName(fallback || member?.nickname || '');
    };
  }

  console.log('✅ V123 麻俠身份／歷史戰績名稱解析修正已載入');
})();
</script>
